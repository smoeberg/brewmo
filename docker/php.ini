; PHP Configuration for BrewMo Development
; Based on PHP 8.1 defaults

; Error reporting
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
log_errors_max_len = 1024
error_log = /var/www/html/custom/brewmo/docker/php-error.log

; Memory limit
memory_limit = 512M

; File uploads
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Session
session.save_path = "/var/www/html/custom/brewmo/docker/sessions"
session.cookie_lifetime = 0

; Timezone
date.timezone = Europe/Copenhagen

; MySQL
mysqli.reconnect = On

; Dolibarr specific
max_execution_time = 300
max_input_time = 300
